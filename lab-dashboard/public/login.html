<!doctype html>
<html lang="en" data-theme="tactical">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Home-lab Control</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#06090e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='6,2 26,2 30,6 30,26 26,30 6,30 2,26 2,6' fill='%2304232d' stroke='%2300d2f0' stroke-width='2'/><polyline points='2,12 10,12 13,9 22,9 25,12 30,12' fill='none' stroke='%2300d2f0' stroke-width='1.4'/><rect x='6' y='22' width='3' height='4' fill='%23f2541b'/><rect x='11' y='22' width='3' height='4' fill='%23f2541b'/><rect x='16' y='22' width='3' height='4' fill='none' stroke='%2300d2f0' stroke-width='1.2'/></svg>">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Auth gate — ธีม Tactical (Cyber-Frame HUD) ของ Home-lab Control Panel
   สี/เส้น/มุมตัด 45° ดึงจาก styles.css ของแดชบอร์ด (ธีม tactical)
   ไฟล์นี้ self-contained เพราะ /styles.css อยู่หลัง forward_auth
   ══════════════════════════════════════════════════════════════════════════ */
:root {
    color-scheme: dark;
    --page:        #050e15;
    --surface-1:   #04232d;
    --surface-2:   #073240;
    --ink-1:       #e6fbff;
    --ink-2:       #7adff2;
    --ink-muted:   #4396ab;
    --cyan:        #00d2f0;
    --orange:      #f2541b;
    --green:       #00e5a3;
    --critical:    #ff3b30;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; min-height: 100%; }

body {
    background: var(--page);
    color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px max(16px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
}

/* ── ชั้นพื้นหลัง: ตารางไซแอน + แสงเรือง (เหมือน body::before ของธีม tactical) ── */
.fx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
        radial-gradient(980px 540px at 14% -8%, rgba(0, 210, 240, .14), transparent 64%),
        radial-gradient(820px 460px at 88% 4%,  rgba(242, 84, 27, .09), transparent 60%),
        repeating-linear-gradient(0deg,  rgba(0, 210, 240, .04) 0 1px, transparent 1px 36px),
        repeating-linear-gradient(90deg, rgba(0, 210, 240, .04) 0 1px, transparent 1px 36px);
}
/* เส้นสแกนวิ่งลงมาแบบช้า ๆ */
.fx::after {
    content: "";
    position: absolute; left: 0; right: 0; height: 140px;
    background: linear-gradient(180deg, transparent, rgba(0, 210, 240, .055) 55%, transparent);
    animation: scan 9s linear infinite;
}
@keyframes scan { from { top: -140px; } to { top: 100%; } }

/* ── กรอบ HUD (เส้นตัดมุม 45°) ────────────────────────────────────────────── */
.gate { position: relative; z-index: 1; width: 100%; max-width: 424px; }

.panel {
    position: relative;
    background: linear-gradient(180deg, rgba(4, 35, 45, .96), rgba(5, 14, 21, .97));
    padding: 30px 26px 22px;
    clip-path: polygon(
        11px 0,
        calc(100% - 11px) 0,
        100% 11px,
        100% calc(100% - 11px),
        calc(100% - 11px) 100%,
        11px 100%,
        0 calc(100% - 11px),
        0 11px
    );
    box-shadow: inset 0 0 28px rgba(0, 210, 240, .06), 0 12px 30px -18px rgba(0, 0, 0, .92);
}
.hud {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3; overflow: visible;
    filter: drop-shadow(0 0 6px rgba(0, 210, 240, .24));
}

/* ── หัวการ์ด ────────────────────────────────────────────────────────────── */
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }

.mark {
    width: 40px; height: 40px; flex: none; position: relative;
    background: #04232d;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 16px -2px rgba(0, 210, 240, .65);
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
}
.mark::after {
    content: ""; position: absolute; inset: 9px;
    background:
        linear-gradient(var(--orange) 0 0) 0 0 / 100% 3px no-repeat,
        linear-gradient(var(--cyan) 0 0) 0 7px / 70% 2px no-repeat,
        linear-gradient(var(--cyan) 0 0) 0 12px / 45% 2px no-repeat;
}

.head__text { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.head__text strong {
    font-family: var(--mono); font-size: 14px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em; color: var(--ink-1);
    text-shadow: 0 0 14px rgba(0, 210, 240, .45);
}
.head__text span {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    color: var(--ink-muted); text-transform: uppercase;
}

.clock {
    margin-left: auto; flex: none;
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
    color: var(--ink-2); padding: 5px 9px;
    border: 1px solid var(--cyan); background: rgba(0, 210, 240, .07);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

/* ── แถบสถานะ ────────────────────────────────────────────────────────────── */
.status {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-2);
    padding: 8px 10px; margin-bottom: 20px;
    background: rgba(0, 229, 163, .06);
    border-left: 2px solid var(--green);
}
.status .dot {
    width: 7px; height: 7px; flex: none; background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2.4s ease-in-out infinite;
}
.status .sep { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,229,163,.5), transparent); }
.status .sep + span { color: var(--ink-muted); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* ── ฟอร์ม ────────────────────────────────────────────────────────────────── */
label.lbl {
    display: block; margin-bottom: 7px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-muted);
}

.field { position: relative; display: flex; align-items: center; }
.field .ico {
    position: absolute; left: 12px; width: 17px; height: 17px;
    fill: none; stroke: var(--ink-muted); stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
}
.field input {
    width: 100%; padding: 13px 44px 13px 38px;
    background: rgba(3, 18, 25, .92);
    border: 1px solid rgba(0, 210, 240, .32);
    color: var(--ink-1);
    font-family: var(--mono); font-size: 15px; letter-spacing: .06em;
    outline: none;
    clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
    transition: border-color .18s, box-shadow .18s;
}
.field input::placeholder { color: #2f6b7d; letter-spacing: .3em; }
.field input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px rgba(0, 210, 240, .35), 0 0 18px -4px rgba(0, 210, 240, .55);
}
.field input:-webkit-autofill {
    -webkit-text-fill-color: var(--ink-1);
    -webkit-box-shadow: 0 0 0 40px #04232d inset;
}
.eye {
    position: absolute; right: 8px;
    width: 30px; height: 30px; display: grid; place-items: center;
    background: none; border: 0; cursor: pointer; padding: 0;
}
.eye svg { width: 17px; height: 17px; fill: none; stroke: var(--ink-muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.eye:hover svg, .eye:focus-visible svg { stroke: var(--cyan); }
.eye[hidden] { display: none; }

/* ── ตัวเลือกจดจำฉัน ──────────────────────────────────────────────────────── */
.keep {
    display: flex; align-items: center; gap: 9px; margin-top: 14px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    color: var(--ink-2); cursor: pointer; user-select: none;
}
.keep input {
    appearance: none; -webkit-appearance: none;
    width: 15px; height: 15px; margin: 0; flex: none;
    border: 1px solid rgba(0, 210, 240, .45); background: rgba(3, 18, 25, .9);
    display: grid; place-items: center; cursor: pointer;
}
.keep input::after {
    content: ""; width: 7px; height: 7px; background: var(--cyan);
    transform: scale(0); transition: transform .14s ease;
}
.keep input:checked::after { transform: scale(1); }
.keep input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ── ข้อความผิดพลาด ───────────────────────────────────────────────────────── */
.err {
    display: flex; align-items: flex-start; gap: 9px;
    margin-top: 16px; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.45; color: #ffd9d6;
    background: rgba(255, 59, 48, .12);
    border-left: 2px solid var(--critical);
}
.err[hidden] { display: none; }
.err svg { width: 15px; height: 15px; flex: none; margin-top: 1px; fill: none; stroke: var(--critical); stroke-width: 1.8; stroke-linecap: round; }
.shake { animation: shake .38s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
}

/* ── ปุ่มหลัก ─────────────────────────────────────────────────────────────── */
.cta {
    position: relative; width: 100%; margin-top: 20px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 18px; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
    color: #00181f; background: var(--cyan);
    border: 0;
    clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
    transition: filter .16s, transform .16s;
    overflow: hidden;
}
/* แถบสีส้มแทคติคอลมุมขวาล่าง */
.cta::after {
    content: ""; position: absolute; right: 0; bottom: 0; width: 34px; height: 4px;
    background: var(--orange);
}
.cta:hover:not(:disabled) { filter: brightness(1.12); }
.cta:active:not(:disabled) { transform: translateY(1px); }
.cta:disabled { cursor: progress; filter: saturate(.55) brightness(.85); }
.cta:focus-visible { outline: 2px solid var(--ink-1); outline-offset: 2px; }

.spinner {
    width: 14px; height: 14px; flex: none; display: none;
    border: 2px solid rgba(0, 24, 31, .3); border-top-color: #00181f;
    border-radius: 50%; animation: spin .7s linear infinite;
}
.is-busy .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── ท้ายการ์ด ───────────────────────────────────────────────────────────── */
.foot {
    display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between;
    margin-top: 20px; padding-top: 13px;
    border-top: 1px solid rgba(0, 210, 240, .18);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-muted);
}
.foot .accent { color: var(--orange); }

/* ── จอเล็ก ───────────────────────────────────────────────────────────────── */
@media (max-width: 420px) {
    .panel { padding: 24px 18px 18px; }
    .head__text strong { font-size: 12.5px; }
    .clock { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    .fx::after, .status .dot, .spinner { animation: none !important; }
    .shake { animation: none !important; }
}
</style>
</head>
<body>
<div class="fx" aria-hidden="true"></div>

<main class="gate">
  <section class="panel" id="panel">
    <!-- HUD frame: เส้นตัดมุม 45° แบบเดียวกับการ์ดในแดชบอร์ด (วาดด้วย JS) -->
    <svg class="hud" id="hud" aria-hidden="true"></svg>

    <header class="head">
      <span class="mark" aria-hidden="true"></span>
      <span class="head__text">
        <strong>Home-lab Control</strong>
        <span>Secure access gateway</span>
      </span>
      <span class="clock" id="clock">--:--:--</span>
    </header>

    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span>System nominal</span>
      <span class="sep" aria-hidden="true"></span>
      <span id="site">tailscale</span>
    </div>

    <form id="form" autocomplete="off" novalidate>
      <label class="lbl" for="pw">Access key</label>
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="pw" name="password" type="password" placeholder="••••••••" autocomplete="current-password"
               spellcheck="false" autocapitalize="off" required>
        <button type="button" class="eye" id="eye" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <label class="keep">
        <input type="checkbox" id="remember" name="remember">
        <span>Keep me signed in · 30 days</span>
      </label>

      <div class="err" id="err" role="alert" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v4M12 16h.01"></path>
        </svg>
        <span id="err-text"></span>
      </div>

      <button class="cta" id="submit" type="submit">
        <span class="cta__label">Authenticate</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <footer class="foot">
      <span>Session · HMAC-SHA256 signed cookie</span>
      <span class="accent" id="foot-site">—</span>
    </footer>
  </section>
</main>

<script>
(function () {
  'use strict';

  var form    = document.getElementById('form');
  var pw      = document.getElementById('pw');
  var remember= document.getElementById('remember');
  var errBox  = document.getElementById('err');
  var errText = document.getElementById('err-text');
  var submit  = document.getElementById('submit');
  var panel   = document.getElementById('panel');
  var eye     = document.getElementById('eye');
  var clock   = document.getElementById('clock');
  var siteEl  = document.getElementById('site');
  var footSite= document.getElementById('foot-site');
  var hud     = document.getElementById('hud');

  // ── HUD frame (กรอบตัดมุม 45° ชุดเดียวกับการ์ดในแดชบอร์ด) ───────────────
  var C  = '#00d2f0';                       // ไซแอนไฟฟ้า
  var CD = 'rgba(0, 210, 240, 0.42)';       // เส้นบาง
  var O  = '#f2541b';                       // ส้มแทคติคอล

  function drawHud() {
    var w = Math.round(panel.clientWidth);
    var h = Math.round(panel.clientHeight);
    if (!w || !h) return;
    var x1 = w - 1.5, y1 = h - 1.5;
    var c  = 13;
    var sx = Math.round(w * 0.46);
    var outer = 'M 1.5,' + c + ' L ' + c + ',1.5 H ' + (x1 - c) + ' L ' + x1 + ',' + c +
                ' V ' + (y1 - c) + ' L ' + (x1 - c) + ',' + y1 + ' H ' + c + ' L 1.5,' + (y1 - c) + ' Z';
    var heavy = 'M 1.5,' + (c + 22) + ' V ' + c + ' L ' + c + ',1.5 H ' + (c + 32) +
                ' M ' + (x1 - c - 32) + ',' + y1 + ' H ' + (x1 - c) + ' L ' + x1 + ',' + (y1 - c) +
                ' V ' + (y1 - c - 22);
    var stepLine = 'M 1.5,38 H ' + sx + ' L ' + (sx + 9) + ',29 H ' + x1;
    var extra = '<line x1="1.5" y1="' + (c + 28) + '" x2="1.5" y2="' + Math.max(c + 36, h - c - 20) +
                '" stroke="' + O + '" stroke-width="3"/>' +
                '<path d="M ' + x1 + ',' + (y1 - 22) + ' V ' + y1 + ' H ' + (x1 - 22) +
                '" fill="none" stroke="' + O + '" stroke-width="2.6"/>';

    hud.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    hud.innerHTML =
      '<path d="' + outer + '" fill="none" stroke="' + C + '" stroke-width="1.35"/>' +
      '<path d="' + heavy + '" fill="none" stroke="' + C + '" stroke-width="3" stroke-linecap="square"/>' +
      '<path d="' + stepLine + '" fill="none" stroke="' + CD + '" stroke-width="1.15"/>' +
      extra;
  }
  drawHud();
  window.addEventListener('resize', drawHud);
  if (window.ResizeObserver) new ResizeObserver(drawHud).observe(panel);

  // ── ปลายทางที่จะกลับไปหลังล็อกอิน (กัน open redirect) ────────────────────
  var rd = '/';
  try {
    var raw = new URLSearchParams(location.search).get('rd') || '/';
    if (raw.charAt(0) === '/' && raw.charAt(1) !== '/' && !/[\r\n\t]/.test(raw)) rd = raw;
  } catch (_) { /* ignore */ }

  // ── นาฬิกา ───────────────────────────────────────────────────────────────
  function tick() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);

  // ── ชื่อเครื่อง (ดึงจาก /api/session ถ้าเปิดให้เข้าถึงได้) ──────────────
  fetch('/api/session', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (d && d.site) {
        siteEl.textContent = d.site;
        footSite.textContent = d.site;
      }
    })
    .catch(function () { /* ไม่มีสิทธิ์อ่าน — ใช้ค่าเริ่มต้น */ });
  footSite.textContent = location.host;

  // ── ปุ่มตา ───────────────────────────────────────────────────────────────
  eye.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.setAttribute('title', show ? 'Hide password' : 'Show password');
    pw.focus();
  });

  // ── แสดง/ซ่อนข้อความผิดพลาด ─────────────────────────────────────────────
  function showError(msg) {
    errText.textContent = msg;
    errBox.hidden = false;
    panel.classList.remove('shake');
    void panel.offsetWidth;          // รีสตาร์ทแอนิเมชัน
    panel.classList.add('shake');
  }
  function clearError() {
    errBox.hidden = true;
    errText.textContent = '';
  }

  // ── ส่งฟอร์ม ──────────────────────────────────────────────────────────────
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var value = pw.value;
    if (!value) { showError('Enter the access key.'); pw.focus(); return; }

    submit.disabled = true;
    submit.classList.add('is-busy');
    submit.querySelector('.cta__label').textContent = 'Verifying';

    var body = new URLSearchParams();
    body.set('password', value);
    body.set('rd', rd);
    if (remember.checked) body.set('remember', '1');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
      body: body.toString(),
      credentials: 'same-origin'
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          return { status: r.status, data: d };
        });
      })
      .then(function (res) {
        if (res.status === 200 && res.data && res.data.ok) {
          location.replace(res.data.redirect || rd);
          return;
        }
        var msg = (res.data && res.data.error) || 'Sign-in failed. Please try again.';
        showError(msg);
        pw.select();
      })
      .catch(function () {
        showError('Cannot reach the control panel. Check the connection and retry.');
      })
      .finally(function () {
        submit.disabled = false;
        submit.classList.remove('is-busy');
        submit.querySelector('.cta__label').textContent = 'Authenticate';
      });
  });

  pw.focus();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>

</body>
</html>
