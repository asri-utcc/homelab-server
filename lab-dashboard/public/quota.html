<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quota Monitor — Homelab Control</title>
  <style>
    :root {
      --bg: #070b12;
      --card: rgba(13, 21, 34, 0.88);
      --border: rgba(56, 189, 248, 0.18);
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.08), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08), transparent 45%),
                  var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1080px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .title-wrap h1 {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-primary {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--cyan);
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .pool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .pool-card.limit-hit {
      border-color: rgba(248, 113, 113, 0.75) !important;
      background: linear-gradient(165deg, rgba(45, 10, 14, 0.92), rgba(18, 10, 18, 0.92));
      animation: limit-pulse 2s ease-in-out infinite;
    }
    @keyframes limit-pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.22), inset 0 0 14px rgba(239, 68, 68, 0.08); }
      50% { box-shadow: 0 0 26px rgba(239, 68, 68, 0.55), inset 0 0 22px rgba(239, 68, 68, 0.16); }
    }
    .pace-crit {
      background: #ef4444 !important;
      border-color: #ef4444 !important;
      color: #ffffff !important;
      animation: badge-blink 1.4s ease-in-out infinite;
    }
    @keyframes badge-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    /* 7-Segment Daily Weekly Rack (Exact port from ai-quota-extension) */
    .weekly-rack {
      margin-top: 18px;
      background: #111319;
      border: 1px solid #242834;
      border-radius: 6px;
      padding: 4px;
      position: relative;
    }
    .segment-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .segment-cell {
      position: relative;
      height: 22px;
      background: #181b24;
      border: 1px solid #292d3b;
      border-radius: 4px;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .segment-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
      opacity: 0.9;
      border-radius: 3px;
      transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease;
    }
    .day-tag {
      position: relative;
      z-index: 2;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: #727988;
      user-select: none;
      line-height: 1;
    }
    .segment-cell.has-usage .day-tag { color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .segment-cell.is-today {
      border: 2px solid #facc15 !important;
      background: rgba(250, 204, 21, 0.14) !important;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
      z-index: 4;
    }
    .segment-cell.is-today .day-tag { color: #fef08a !important; font-weight: 800; }
    .today-pointer {
      position: absolute;
      top: -17px;
      left: 50%;
      transform: translateX(-50%);
      background: #facc15;
      color: #000000;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 10;
      line-height: 1.15;
    }
    .segment-cell.is-over-budget {
      border-color: rgba(239, 68, 68, 0.75) !important;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.28);
    }
    .segment-cell.is-over-budget .segment-fill {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important;
      opacity: 0.95 !important;
    }
    .segment-cell.is-over-budget .day-tag { color: #fecaca !important; font-weight: 800; }

    .pace-summary {
      font-size: 11.5px;
      color: #b3b8c4;
      margin-top: 8px;
      padding: 6px 9px;
      background: #111319;
      border-left: 3px solid #282c38;
      border-radius: 4px;
      line-height: 1.4;
    }
    .pace-summary.level-2-summary {
      border-left-color: var(--amber);
      color: #fde68a;
      background: rgba(245, 158, 11, 0.08);
    }
    .pace-summary.level-3-summary {
      border-left-color: var(--red);
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      font-weight: 600;
    }

    /* Big Realtime Countdown Box (from ai-quota-extension) */
    .big-countdown-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.45);
      text-align: center;
    }
    .big-countdown-box.active { display: block; }
    .big-countdown-label {
      font-size: 11px;
      color: #f87171;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .big-countdown-timer {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }
    .pool-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .pool-name { font-size: 14px; font-weight: 700; }
    .pace-badge {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .pace-ok { background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.45); color: var(--green); }
    .pace-warn { background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.45); color: var(--amber); }
    .pace-crit { background: rgba(248, 113, 113, 0.15); border-color: rgba(248, 113, 113, 0.45); color: var(--red); }

    .pool-pct {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .pool-pct span { font-size: 12px; font-weight: 500; color: var(--muted); }
    .bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .pool-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      overflow-x: auto;
    }
    .table-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    th, td {
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    th {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }
    td.mono { font-family: var(--mono); }
    .mini-bar {
      width: 90px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    .mini-bar > div { height: 100%; border-radius: 999px; }
    .err-box {
      padding: 16px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.14);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #fecaca;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-wrap">
        <h1>📊 AI Quota Monitor</h1>
        <div class="sub" id="sub-info">กำลังเชื่อมต่อ Antigravity Quota API...</div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-refresh">↻ รีเฟรช</button>
        <a href="/gemini.html" class="btn">← กลับหน้า AI</a>
      </div>
    </header>

    <div class="err-box" id="err-box"></div>

    <div class="pool-grid" id="pool-grid"></div>

    <div style="margin-bottom: 12px;">
      <button type="button" class="btn" id="btn-toggle-models" style="font-size:11.5px; padding:6px 12px;">📋 ดูรายละเอียดรายโมเดล (20 โมเดล) ▾</button>
    </div>

    <div class="table-card" id="models-table-card" style="display:none;">
      <div class="table-title">
        <span>🤖 รายละเอียดโควตาแยกรายโมเดล (All Models)</span>
        <span class="sub" id="models-count"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Model ID</th>
            <th>คงเหลือ (Remaining)</th>
            <th>ใช้ไป (Used)</th>
            <th>เวลารีเซ็ต (Reset Countdown)</th>
          </tr>
        </thead>
        <tbody id="models-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function fmtCountdown(iso) {
      if (!iso) return '—';
      const diff = new Date(iso).getTime() - Date.now();
      if (Number.isNaN(diff)) return '—';
      if (diff <= 0) return 'พร้อมรีเซ็ตแล้ว';
      const days = Math.floor(diff / 86400000);
      const hrs = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      if (days > 0) {
        return `${days} วัน ${hrs} ชม. ${String(mins).padStart(2, '0')} น. ${String(secs).padStart(2, '0')} วิ`;
      }
      return `${hrs} ชม. ${String(mins).padStart(2, '0')} น. ${String(secs).padStart(2, '0')} วิ`;
    }

    function fmtLocalTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }

    function colorForPct(pct) {
      if (pct >= 50) return '#34d399';
      if (pct >= 20) return '#fbbf24';
      return '#f87171';
    }

    function paceForPct(pct) {
      if (pct >= 50) return { cls: 'pace-ok', text: '● ปกติ (On Pace)' };
      if (pct >= 20) return { cls: 'pace-warn', text: '▲ เร่งตัว (High Burn)' };
      return { cls: 'pace-crit', text: '⚡ วิกฤติ (Critical)' };
    }

    const SLOT_SIZE = 100 / 7;

    function calculateWeeklyPace(usedPct, resetIso, now = Date.now()) {
      const safePct = Math.min(100, Math.max(0, Math.round(usedPct || 0)));
      const resetEpoch = resetIso ? new Date(resetIso).getTime() : 0;
      let daysRemaining = 3.5;
      let hasValidEpoch = false;

      if (resetEpoch && resetEpoch > now) {
        daysRemaining = (resetEpoch - now) / (86400 * 1000);
        hasValidEpoch = true;
      }

      const cycleDays = 7;
      const daysRemainingClamped = Math.min(cycleDays, Math.max(0, daysRemaining));
      const daysElapsed = Math.min(cycleDays, Math.max(0, cycleDays - daysRemainingClamped));
      const expectedPct = (daysElapsed / cycleDays) * 100;
      const delta = safePct - expectedPct;
      const remainingQuotaPct = Math.max(0, 100 - safePct);
      const suggestedDailyBudget = daysRemainingClamped > 0.2
        ? (remainingQuotaPct / daysRemainingClamped)
        : remainingQuotaPct;

      const currentDayIndex = Math.min(7, Math.max(1, Math.ceil(daysElapsed) || 1));
      const daysAhead = delta > 0 ? (delta / (100 / cycleDays)).toFixed(1) : '0';

      let level = 1;
      let badgeCls = 'pace-ok';
      let badgeLabel = '● ปกติ (On Pace)';
      let summaryClass = '';
      let summaryText = `อยู่ในเกณฑ์: เหลืออีก ${daysRemainingClamped.toFixed(1)} วัน | ใช้ได้เฉลี่ย ~${suggestedDailyBudget.toFixed(0)}%/วัน`;

      if (delta > 20 || (safePct >= 90 && daysRemainingClamped >= 1.5) || safePct >= 98) {
        level = 3;
        badgeCls = 'pace-crit';
        badgeLabel = '⚡ วิกฤติ (Critical)';
        summaryClass = 'level-3-summary';
        summaryText = `วิกฤติ! ใช้ล้นเกินจุดวันนี้ไป ~${daysAhead} วัน (+${Math.max(0, Math.round(delta))}%) | เหลือ ${daysRemainingClamped.toFixed(1)} วัน (ควรชะลอการใช้)`;
      } else if (delta > 5 || (safePct >= 75 && daysRemainingClamped >= 2)) {
        level = 2;
        badgeCls = 'pace-warn';
        badgeLabel = '▲ เร่งตัว (High Burn)';
        summaryClass = 'level-2-summary';
        summaryText = `เร่งตัว: ใช้ล้นเกินจุดวันนี้ไป ~${daysAhead} วัน (+${Math.round(delta)}%) | เหลือ ${daysRemainingClamped.toFixed(1)} วัน (แนะชะลอเหลือ ~${suggestedDailyBudget.toFixed(0)}%/วัน)`;
      }

      return { safePct, currentDayIndex, badgeCls, badgeLabel, summaryClass, summaryText, hasValidEpoch };
    }

    function build7SegmentRackHtml(usedPct, currentDayIndex) {
      const safePct = Math.min(100, Math.max(0, Number(usedPct) || 0));
      let cells = '';
      for (let idx = 0; idx < 7; idx++) {
        const dayNumber = idx + 1;
        const lower = idx * SLOT_SIZE;
        const upper = (idx + 1) * SLOT_SIZE;
        let fillPct = 0;
        if (safePct >= upper) fillPct = 100;
        else if (safePct > lower) fillPct = Math.round(((safePct - lower) / SLOT_SIZE) * 100);

        const isToday = dayNumber === currentDayIndex;
        const isOver = (dayNumber > currentDayIndex) && (fillPct > 0);
        const cls = [
          'segment-cell',
          fillPct > 0 ? 'has-usage' : '',
          isToday ? 'is-today' : '',
          isOver ? 'is-over-budget' : ''
        ].filter(Boolean).join(' ');

        const pointer = isToday ? '<span class="today-pointer">▼ วันนี้</span>' : '';
        const title = `วันที่ ${dayNumber} ของรอบ${isToday ? ' (วันนี้)' : ''} - ใช้โควตาส่วนนี้ไป ${fillPct}%`;
        cells += `<div class="${cls}" title="${title}"><div class="segment-fill" style="height:${fillPct}%"></div><span class="day-tag">D${dayNumber}</span>${pointer}</div>`;
      }
      return `<div class="weekly-rack"><div class="segment-grid">${cells}</div></div>`;
    }

    let lastData = null;

    function renderQuota(data) {
      lastData = data;
      const errBox = document.getElementById('err-box');
      if (!data || !data.ok) {
        errBox.style.display = 'block';
        errBox.textContent = '❌ ไม่สามารถดึงข้อมูลโควตาได้: ' + (data?.error || 'Unknown error');
        return;
      }
      errBox.style.display = 'none';

      document.getElementById('sub-info').textContent =
        `บัญชี: ${data.email} · อัปเดตล่าสุด: ${new Date(data.updatedAt).toLocaleTimeString('th-TH')}`;

      const poolGrid = document.getElementById('pool-grid');
      poolGrid.innerHTML = '';
      (data.pools || []).forEach(p => {
        const isExhausted = p.remainingPct <= 0;
        const barColor = colorForPct(p.remainingPct);
        const pace = calculateWeeklyPace(p.usedPct, p.resetTime);
        const badgeText = isExhausted ? '⚡ หมดโควตา (0%)' : pace.badgeLabel;
        const badgeCls = isExhausted ? 'pace-crit' : pace.badgeCls;
        const rackHtml = build7SegmentRackHtml(p.usedPct, pace.currentDayIndex);

        const card = document.createElement('div');
        card.className = `pool-card ${isExhausted ? 'limit-hit' : ''}`;
        card.innerHTML = `
          <div class="pool-head">
            <div class="pool-name" style="color:${isExhausted ? '#fca5a5' : p.color}">${p.name}</div>
            <span class="pace-badge ${badgeCls}">${badgeText}</span>
          </div>
          <div class="pool-pct" style="color:${barColor}">${p.remainingPct}% <span>คงเหลือ</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${p.remainingPct}%; background:${barColor};"></div></div>
          <div class="pool-meta">
            <span>ใช้ไป ${p.usedPct}% (${p.modelsCount} โมเดล)</span>
            <span class="cd" data-reset="${p.resetTime || ''}">${fmtCountdown(p.resetTime)}</span>
          </div>
          ${rackHtml}
          <div class="pace-summary ${pace.summaryClass}">${pace.summaryText}</div>
          <div class="big-countdown-box ${isExhausted ? 'active' : ''}">
            <div class="big-countdown-label">🔴 หมดโควตาแล้ว — รอรีเซ็ตในอีก</div>
            <div class="big-countdown-timer cd" data-reset="${p.resetTime || ''}">${fmtCountdown(p.resetTime)}</div>
          </div>
        `;
        poolGrid.appendChild(card);
      });

      const tbody = document.getElementById('models-tbody');
      tbody.innerHTML = '';
      document.getElementById('models-count').textContent = `${(data.models || []).length} โมเดล`;
      (data.models || []).forEach(m => {
        const col = colorForPct(m.remainingPct);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${m.id}</td>
          <td class="mono">
            <span class="mini-bar"><div style="width:${m.remainingPct}%; background:${col};"></div></span>
            <strong style="color:${col}">${m.remainingPct}%</strong>
          </td>
          <td class="mono" style="color:var(--muted)">${m.usedPct}%</td>
          <td class="mono"><span class="cd" data-reset="${m.resetTime || ''}">${fmtCountdown(m.resetTime)}</span> <span style="color:var(--muted)">(${fmtLocalTime(m.resetTime)})</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadQuota() {
      try {
        const res = await fetch('/api/gemini/quota');
        const data = await res.json();
        renderQuota(data);
      } catch (err) {
        renderQuota({ ok: false, error: err.message });
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', loadQuota);
    document.getElementById('btn-toggle-models').addEventListener('click', (e) => {
      const card = document.getElementById('models-table-card');
      const open = card.style.display === 'none';
      card.style.display = open ? 'block' : 'none';
      e.target.textContent = open ? '📋 ซ่อนรายละเอียดรายโมเดล ▴' : '📋 ดูรายละเอียดรายโมเดล (20 โมเดล) ▾';
    });
    loadQuota();
    setInterval(loadQuota, 60000);
    setInterval(() => {
      document.querySelectorAll('.cd[data-reset]').forEach(el => {
        const rt = el.getAttribute('data-reset');
        if (rt) el.textContent = fmtCountdown(rt);
      });
    }, 1000);
  </script>
</body>
</html>
